<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080a0f">
<title>FitTrack Pro</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
/* ── TOKENS ───────────────────────────────────────────────────────── */
:root {
  --bg: #080a0f;
  --s1: #0f1219;
  --s2: #161b26;
  --s3: #1e2535;
  --b1: #252f42;
  --b2: #2e3d58;
  --lime: #c8f135;
  --lime2: #a8d020;
  --red: #ff3b5c;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --orange: #f97316;
  --green: #22c55e;
  --t1: #f0f4ff;
  --t2: #7a8ba8;
  --t3: #3d4f6b;
  --r: 8px;
  --r2: 16px;
  --r3: 24px;
  --fd: 'Space Grotesk', sans-serif;
  --fm: 'Space Mono', monospace;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--t1); font-family: var(--fd); font-size: 14px; overflow-x: hidden; }
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: var(--s1); } ::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }

/* ── LAYOUT ───────────────────────────────────────────────────────── */
#app { min-height: 100vh; display: flex; flex-direction: column; }
#main { flex: 1; padding: 16px 16px 80px; max-width: 640px; margin: 0 auto; width: 100%; }
@media (min-width: 768px) { #app { flex-direction: row; } #main { margin-left: 80px; padding: 28px 32px; max-width: 960px; } }

/* ── NAV ──────────────────────────────────────────────────────────── */
#nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--s1); border-top: 1px solid var(--b1); display: flex; z-index: 100; height: 64px; }
@media (min-width: 768px) { #nav { top: 0; left: 0; bottom: 0; right: auto; width: 80px; flex-direction: column; border-top: none; border-right: 1px solid var(--b1); height: auto; padding: 16px 0; } }
.nb { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; color: var(--t3); cursor: pointer; font-family: var(--fd); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 6px 2px; transition: color .15s; }
@media (min-width: 768px) { .nb { flex: 0; padding: 16px 8px; } }
.nb:hover { color: var(--t2); }
.nb.on { color: var(--lime); }
.nb.on .nb-icon { background: rgba(200,241,53,.1); }
.nb-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.nb svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── TYPOGRAPHY ───────────────────────────────────────────────────── */
.page-title { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
.page-sub { font-size: 13px; color: var(--t2); margin-bottom: 20px; }
.section-title { font-family: var(--fm); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--t3); margin: 20px 0 10px; }
.section-title:first-child { margin-top: 0; }

/* ── CARDS ────────────────────────────────────────────────────────── */
.card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); padding: 16px; margin-bottom: 12px; }
.card-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--t2); margin-bottom: 12px; }

/* ── STAT CARDS ───────────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat-card { background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r2); padding: 14px; }
.stat-val { font-family: var(--fm); font-size: 28px; font-weight: 700; line-height: 1; color: var(--lime); }
.stat-val.red { color: var(--red); }
.stat-val.blue { color: var(--blue); }
.stat-val.purple { color: var(--purple); }
.stat-val.orange { color: var(--orange); }
.stat-label { font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; font-weight: 600; }

/* ── FIELDS ───────────────────────────────────────────────────────── */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--t2); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r); color: var(--t1); padding: 11px 14px; font-size: 14px; outline: none; font-family: var(--fd); transition: border-color .15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--lime); }
.field select option { background: var(--s2); }
.field textarea { resize: vertical; min-height: 80px; }
.field .hint { font-size: 11px; color: var(--t3); margin-top: 4px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* ── BUTTONS ──────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: var(--r); border: none; cursor: pointer; font-family: var(--fd); font-size: 14px; font-weight: 600; transition: all .15s; }
.btn-primary { background: var(--lime); color: #080a0f; }
.btn-primary:hover { background: var(--lime2); }
.btn-ghost { background: var(--s2); color: var(--t2); border: 1px solid var(--b1); }
.btn-ghost:hover { color: var(--t1); border-color: var(--b2); }
.btn-danger { background: rgba(255,59,92,.15); color: var(--red); border: 1px solid rgba(255,59,92,.3); }
.btn-full { width: 100%; }
.btn-sm { padding: 7px 14px; font-size: 12px; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn { width: 36px; height: 36px; border-radius: var(--r); background: var(--s2); border: 1px solid var(--b1); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--t2); transition: all .15s; }
.icon-btn:hover { color: var(--t1); border-color: var(--b2); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── CHIPS ────────────────────────────────────────────────────────── */
.chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
.chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--b1); background: var(--s2); color: var(--t2); font-size: 12px; cursor: pointer; transition: all .12s; font-weight: 500; user-select: none; }
.chip:hover { border-color: var(--b2); color: var(--t1); }
.chip.on { background: rgba(200,241,53,.1); border-color: var(--lime); color: var(--lime); }

/* ── TAGS ─────────────────────────────────────────────────────────── */
.tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.tag-lime { background: rgba(200,241,53,.1); color: var(--lime); border: 1px solid rgba(200,241,53,.25); }
.tag-blue { background: rgba(59,130,246,.1); color: #60a5fa; border: 1px solid rgba(59,130,246,.25); }
.tag-red { background: rgba(255,59,92,.1); color: var(--red); border: 1px solid rgba(255,59,92,.25); }
.tag-purple { background: rgba(139,92,246,.1); color: #a78bfa; border: 1px solid rgba(139,92,246,.25); }
.tag-orange { background: rgba(249,115,22,.1); color: #fb923c; border: 1px solid rgba(249,115,22,.25); }

/* ── PROGRESS BAR ─────────────────────────────────────────────────── */
.progress-bar { height: 6px; background: var(--s3); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; background: var(--lime); transition: width .5s ease; }
.progress-fill.red { background: var(--red); }
.progress-fill.blue { background: var(--blue); }

/* ── MODAL ────────────────────────────────────────────────────────── */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 300; display: none; align-items: flex-end; justify-content: center; padding: 0; }
#modal.show { display: flex; }
@media (min-width: 500px) { #modal { align-items: center; padding: 20px; } }
.modal-box { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2) var(--r2) 0 0; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
@media (min-width: 500px) { .modal-box { border-radius: var(--r2); } }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--b1); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--s1); z-index: 1; }
.modal-title { font-size: 17px; font-weight: 700; }
.modal-body { padding: 20px; }

/* ── TOAST ────────────────────────────────────────────────────────── */
#toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--s1); border: 1px solid var(--lime); color: var(--t1); padding: 12px 20px; border-radius: var(--r2); font-size: 13px; font-weight: 500; z-index: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.4); transition: transform .25s ease; white-space: nowrap; }
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.error { border-color: var(--red); }

/* ── LOADER ───────────────────────────────────────────────────────── */
.spinner { width: 22px; height: 22px; border: 2px solid var(--b2); border-top-color: var(--lime); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-page { display: flex; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; color: var(--t3); }

/* ── AUTH PAGE ────────────────────────────────────────────────────── */
#auth-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
.auth-logo { font-family: var(--fm); font-size: 28px; font-weight: 700; color: var(--lime); margin-bottom: 8px; letter-spacing: -.02em; }
.auth-tagline { font-size: 13px; color: var(--t3); margin-bottom: 40px; }
.auth-box { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r3); padding: 28px; width: 100%; max-width: 380px; }
.auth-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.auth-sub { font-size: 13px; color: var(--t2); margin-bottom: 24px; }
.auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--t3); }
.auth-switch span { color: var(--lime); cursor: pointer; font-weight: 600; }
.divider { height: 1px; background: var(--b1); margin: 16px 0; }

/* ── EXERCISE CARD ────────────────────────────────────────────────── */
.ex-card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .15s; }
.ex-card:hover { border-color: var(--b2); }
.ex-icon { width: 48px; height: 48px; border-radius: var(--r); background: var(--s3); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.ex-info { flex: 1; min-width: 0; }
.ex-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-muscles { font-size: 11px; color: var(--t3); margin-top: 3px; }
.ex-badges { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }

/* ── WORKOUT CARD ─────────────────────────────────────────────────── */
.workout-card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); padding: 16px; margin-bottom: 10px; }
.workout-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.workout-name { font-weight: 700; font-size: 16px; }
.workout-date { font-size: 11px; color: var(--t3); margin-top: 2px; }
.workout-stats { display: flex; gap: 16px; flex-wrap: wrap; }
.workout-stat { font-size: 12px; color: var(--t2); display: flex; align-items: center; gap: 5px; }

/* ── IMC GAUGE ────────────────────────────────────────────────────── */
.imc-gauge { position: relative; width: 160px; height: 80px; margin: 0 auto 12px; }
.imc-value { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font-family: var(--fm); font-size: 26px; font-weight: 700; }
.imc-label { text-align: center; font-size: 12px; color: var(--t2); margin-top: 4px; }

/* ── MACROS PIE ───────────────────────────────────────────────────── */
.macros-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.macro-item { background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r); padding: 12px; text-align: center; }
.macro-val { font-family: var(--fm); font-size: 20px; font-weight: 700; }
.macro-label { font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; }
.macro-pct { font-size: 11px; color: var(--t2); margin-top: 2px; }

/* ── SEARCH ───────────────────────────────────────────────────────── */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap input { padding-left: 40px !important; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search-icon svg { width: 16px; height: 16px; stroke: var(--t3); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── FILTERS ──────────────────────────────────────────────────────── */
.filter-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; }
.filter-chip { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--b1); background: var(--s2); color: var(--t3); font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .12s; }
.filter-chip.on { background: rgba(200,241,53,.1); border-color: var(--lime); color: var(--lime); }

/* ── SET ROW ──────────────────────────────────────────────────────── */
.set-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--b1); }
.set-row:last-child { border-bottom: none; }
.set-num { font-family: var(--fm); font-size: 12px; color: var(--t3); min-width: 24px; }
.set-input { flex: 1; background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r); color: var(--t1); padding: 8px 10px; font-size: 14px; font-family: var(--fm); text-align: center; outline: none; }
.set-input:focus { border-color: var(--lime); }
.set-unit { font-size: 11px; color: var(--t3); min-width: 24px; }

/* ── PROFILE HEADER ───────────────────────────────────────────────── */
.profile-header { display: flex; align-items: center; gap: 16px; padding: 20px; background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); margin-bottom: 16px; }
.avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--s3); border: 2px solid var(--lime); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: var(--lime); flex-shrink: 0; font-family: var(--fm); }
.profile-name { font-size: 18px; font-weight: 700; }
.profile-level { font-size: 12px; color: var(--t2); margin-top: 3px; }

/* ── NOTIFICATION DOT ─────────────────────────────────────────────── */
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); position: absolute; top: 6px; right: 6px; }

/* ── CHART WRAPPER ────────────────────────────────────────────────── */
.chart-wrap { position: relative; height: 200px; margin-top: 12px; }

/* ── EMPTY STATE ──────────────────────────────────────────────────── */
.empty-state { text-align: center; padding: 48px 20px; color: var(--t3); }
.empty-state svg { width: 48px; height: 48px; stroke: var(--t3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin: 0 auto 14px; opacity: .4; display: block; }
.empty-state h3 { font-size: 16px; font-weight: 600; color: var(--t2); margin-bottom: 6px; }
.empty-state p { font-size: 13px; line-height: 1.6; }

/* ── PROGRAM CARD ─────────────────────────────────────────────────── */
.prog-card { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r2); padding: 16px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s; }
.prog-card:hover { border-color: var(--lime); }
.prog-card.active { border-color: var(--lime); background: rgba(200,241,53,.04); }
.prog-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.prog-name { font-weight: 700; font-size: 15px; }
.prog-meta { font-size: 12px; color: var(--t2); margin-top: 3px; }
.prog-tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── TOGGLE ───────────────────────────────────────────────────────── */
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--b1); }
.toggle-row:last-child { border-bottom: none; }
.toggle { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-slider { position: absolute; inset: 0; background: var(--s3); border-radius: 13px; cursor: pointer; transition: .2s; }
.toggle-slider::before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px; background: var(--t3); border-radius: 50%; transition: .2s; }
.toggle input:checked + .toggle-slider { background: var(--lime); }
.toggle input:checked + .toggle-slider::before { transform: translateX(18px); background: #080a0f; }

/* ── BMI COLORS ───────────────────────────────────────────────────── */
.bmi-underweight { color: #60a5fa; }
.bmi-normal { color: var(--lime); }
.bmi-overweight { color: var(--orange); }
.bmi-obese { color: var(--red); }
</style>
</head>
<body>

<!-- AUTH PAGE -->
<div id="auth-page" style="display:none">
  <div class="auth-logo">FitTrack<span style="color:var(--t2)">Pro</span></div>
  <div class="auth-tagline">Entraînement · Nutrition · Performance</div>
  <div class="auth-box">
    <div id="auth-login">
      <div class="auth-title">Connexion</div>
      <div class="auth-sub">Reprenez là où vous vous êtes arrêté.</div>
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="votre@email.com"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="login-password" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-full" onclick="login()">Se connecter</button>
      <div class="auth-switch">Pas encore de compte ? <span onclick="showRegister()">S'inscrire</span></div>
    </div>
    <div id="auth-register" style="display:none">
      <div class="auth-title">Inscription</div>
      <div class="auth-sub">Créez votre profil de performance.</div>
      <div class="g2" style="gap:12px">
        <div class="field"><label>Prénom</label><input type="text" id="reg-firstname" placeholder="Jean"></div>
        <div class="field"><label>Nom</label><input type="text" id="reg-lastname" placeholder="Dupont"></div>
      </div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="votre@email.com"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="reg-password" placeholder="8 caractères min."></div>
      <button class="btn btn-primary btn-full" onclick="register()">Créer mon compte</button>
      <div class="auth-switch">Déjà un compte ? <span onclick="showLogin()">Se connecter</span></div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">
  <nav id="nav">
    <button class="nb on" onclick="go('dashboard')" id="nb-dashboard">
      <div class="nb-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>
      Dashboard
    </button>
    <button class="nb" onclick="go('workout')" id="nb-workout">
      <div class="nb-icon"><svg viewBox="0 0 24 24"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg></div>
      Séance
    </button>
    <button class="nb" onclick="go('programs')" id="nb-programs">
      <div class="nb-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
      Programmes
    </button>
    <button class="nb" onclick="go('exercises')" id="nb-exercises">
      <div class="nb-icon"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
      Exercices

// ── CALCULATORS ───────────────────────────────────────────────────────
function calcBMI(weight, height) {
  if (!weight || !height) return null;
  return weight / Math.pow(height / 100, 2);
}

function getBMICategory(bmi) {
  if (bmi < 18.5) return { label: 'Insuffisance pondérale', class: 'bmi-underweight', color: '#60a5fa' };
  if (bmi < 25) return { label: 'Poids normal', class: 'bmi-normal', color: '#c8f135' };
  if (bmi < 30) return { label: 'Surpoids', class: 'bmi-overweight', color: '#f97316' };
  return { label: 'Obésité', class: 'bmi-obese', color: '#ff3b5c' };
}

function calcBMR(profile) {
  if (!profile?.weight_kg || !profile?.height_cm || !profile?.date_of_birth || !profile?.gender) return null;
  const age = Math.floor((new Date() - new Date(profile.date_of_birth)) / (365.25 * 24 * 3600 * 1000));
  // Mifflin-St Jeor
  if (profile.gender === 'homme') {
    return 10 * profile.weight_kg + 6.25 * profile.height_cm - 5 * age + 5;
  } else {
    return 10 * profile.weight_kg + 6.25 * profile.height_cm - 5 * age - 161;
  }
}

function getActivityMultiplier(level) {
  const m = { sedentaire: 1.2, leger: 1.375, modere: 1.55, actif: 1.725, tres_actif: 1.9 };
  return m[level] || 1.55;
}

function calcTDEE(profile) {
  const bmr = calcBMR(profile);
  if (!bmr) return null;
  return Math.round(bmr * getActivityMultiplier(profile.activity_level));
}

function calcMacros(tdee, objective) {
  if (!tdee) return null;
  let calories = tdee;
  if (objective === 'seche') calories = Math.round(tdee * 0.85);
  if (objective === 'prise_de_masse') calories = Math.round(tdee * 1.1);
  const protein = Math.round(calories * 0.30 / 4);
  const fat = Math.round(calories * 0.25 / 9);
  const carbs = Math.round((calories - protein * 4 - fat * 9) / 4);
  return { calories, protein, carbs, fat };
}

async function autoSuggestExercises() {
  const p = state.profile;
  const loc = p?.training_location || 'salle';
  const obj = p?.objective || 'maintien';
  const level = p?.experience_level || 'debutant';

  // Sélection des groupes musculaires selon objectif
  const muscleGroups = {
    prise_de_masse: ['Poitrine', 'Dos', 'Jambes', 'Épaules', 'Biceps', 'Triceps'],
    seche: ['Full Body', 'Cardio', 'Abdominaux', 'Jambes', 'Dos'],
    maintien: ['Poitrine', 'Dos', 'Jambes', 'Abdominaux', 'Épaules'],
  };

  const groups = muscleGroups[obj] || muscleGroups.maintien;

  // Sélectionner 6-8 exercices variés
  const suggested = [];
  for (const group of groups.slice(0, 4)) {
    const exList = state.exercises.filter(ex =>
      ex.exercise_categories?.name === group &&
      ex.difficulty === level &&
      (ex.location === loc || ex.location === 'les_deux')
    );
    if (exList.length > 0) {
      suggested.push(exList[Math.floor(Math.random() * exList.length)]);
    }
  }

  // Ajouter les séries auto pour chaque exercice suggéré
  for (const ex of suggested) {
    const sets = obj === 'prise_de_masse' ? 4 : obj === 'seche' ? 3 : 3;
    for (let i = 1; i <= sets; i++) {
      const { data } = await sb.from('workout_sets').insert([{
        workout_id: state.currentWorkout.id,
        exercise_id: ex.id,
        set_number: i
      }]).select().single();
      if (data) {
        if (!state.currentWorkout.sets) state.currentWorkout.sets = [];
        state.currentWorkout.sets.push({ ...data, exercise_name: ex.name });
      }
    }
  }
  toast(`✓ ${suggested.length} exercices suggérés automatiquement`);
}

}

    maintien:       { sets: 3, repsMin: 10, repsMax: 15, rest: 90,  intensity: 'Modéré' },
    force:          { sets: 5, repsMin: 3,  repsMax: 6,  rest: 180, intensity: 'Maximum' },
  };
  return recs[obj] || recs.maintien;
}

function suggestWeight(exId, setNum) {
  // Chercher le dernier poids utilisé pour cet exercice
  const prevSets = state.workouts
    .flatMap(w => w.workout_sets || [])
    .filter(s => s.exercise_id === exId && s.weight_kg)
    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  if (prevSets.length > 0) {
    const lastWeight = prevSets[0].weight_kg;
    // Suggérer +2.5kg si c'est pas la première série
    return setNum > 1 ? lastWeight : lastWeight + 2.5;
  }

  // Sinon suggérer selon poids corporel
  const bw = state.profile?.weight_kg || 70;
  const obj = state.profile?.objective || 'maintien';
  const pcts = { prise_de_masse: 0.4, seche: 0.25, maintien: 0.3 };
  return Math.round((bw * (pcts[obj] || 0.3)) / 2.5) * 2.5;
}

// ── LIVE WORKOUT TIMER ────────────────────────────────────────────────
let workoutTimerInterval = null;

function startLiveTimer() {
  clearInterval(workoutTimerInterval);
  workoutTimerInterval = setInterval(() => {
    const el = document.getElementById('live-timer');
    if (!el) { clearInterval(workoutTimerInterval); return; }
    const elapsed = Math.floor((Date.now() - state.workoutTimer) / 1000);
    const h = Math.floor(elapsed / 3600);
    const m = Math.floor((elapsed % 3600) / 60);
    const s = elapsed % 60;
    el.textContent = h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }, 1000);
}

function adjustVal(inputId, delta) {
  const el = document.getElementById(inputId);
  if (!el) return;
  const current = parseFloat(el.value) || 0;
  el.value = Math.max(0, Math.round((current + delta) * 10) / 10);
  el.dispatchEvent(new Event('change'));
}

function skipWarmup() {
  state.currentWorkout.warmupDone = true;
  render();
}

async function completeSet(setId, exId, restSecs, weightInputId, repsInputId) {
  const weight = parseFloat(document.getElementById(weightInputId)?.value) || 0;
  const reps = parseInt(document.getElementById(repsInputId)?.value) || 0;
  if (!weight || !reps) { toast('Entrez le poids et les reps', 'error'); return; }
  await sb.from('workout_sets').update({ weight_kg: weight, reps }).eq('id', setId);
  const s = state.currentWorkout.sets?.find(x => x.id === setId);
  if (s) { s.weight_kg = weight; s.reps = reps; }
  startRestTimer(restSecs);
  toast(`✓ Série ${reps} reps × ${weight}kg validée`);
  render();
}

// ── REST TIMER ────────────────────────────────────────────────────────
let restInterval = null;
let restSeconds = 0;

function startRestTimer(seconds) {
  stopRestTimer();
  restSeconds = seconds;
  const el = document.getElementById('rest-timer');
  const cd = document.getElementById('rest-countdown');
  if (!el || !cd) return;
  el.style.display = 'block';
  cd.textContent = restSeconds + 's';
  restInterval = setInterval(() => {
    restSeconds--;
    if (cd) cd.textContent = restSeconds + 's';
    if (restSeconds <= 0) {
      stopRestTimer();
      toast('⏱ Fin du repos — à vous !');
    }
  }, 1000);
}

function stopRestTimer() {
  clearInterval(restInterval);
  restInterval = null;
  const el = document.getElementById('rest-timer');
  if (el) el.style.display = 'none';
}

function addExerciseToWorkout() {
  openModal('Ajouter un exercice', `
    <div class="search-wrap">
      <div class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
      <input class="field" type="text" placeholder="Rechercher…" oninput="filterWorkoutExercises(this.value)" style="width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);padding:10px 12px 10px 40px;outline:none;font-family:var(--fd)">
    </div>
    <div id="workout-ex-list">
      ${state.exercises.slice(0, 15).map(ex => `
        <div class="ex-card" onclick="selectExerciseForWorkout('${ex.id}','${ex.name.replace(/'/g,"\\'")}')">
          <div class="ex-icon">${ex.exercise_categories?.icon || '💪'}</div>
          <div class="ex-info">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-muscles">${(ex.muscles_primary || []).join(', ')}</div>
          </div>
        </div>`).join('')}
    </div>`);
}

function filterWorkoutExercises(q) {
  const filtered = state.exercises.filter(ex =>
    ex.name.toLowerCase().includes(q.toLowerCase()) ||
    (ex.muscles_primary || []).some(m => m.toLowerCase().includes(q.toLowerCase()))
  );
  document.getElementById('workout-ex-list').innerHTML = filtered.slice(0, 15).map(ex => `
    <div class="ex-card" onclick="selectExerciseForWorkout('${ex.id}','${ex.name.replace(/'/g,"\\'")}')">
      <div class="ex-icon">${ex.exercise_categories?.icon || '💪'}</div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-muscles">${(ex.muscles_primary || []).join(', ')}</div>
      </div>
    </div>`).join('');
}

function selectExerciseForWorkout(exId, exName) {
  closeModal();
  addSet(exId, exName);
}

async function addSet(exId, exName) {
  const { data, error } = await sb.from('workout_sets').insert([{
    workout_id: state.currentWorkout.id,
    exercise_id: exId,
    set_number: (state.currentWorkout.sets?.filter(s => s.exercise_id === exId).length || 0) + 1
  }]).select().single();
  if (error) { toast(error.message, 'error'); return; }
  if (!state.currentWorkout.sets) state.currentWorkout.sets = [];
  state.currentWorkout.sets.push({ ...data, exercise_name: exName });
  render();
}

async function updateSet(setId, field, value) {
  await sb.from('workout_sets').update({ [field]: parseFloat(value) || null }).eq('id', setId);
  const s = state.currentWorkout.sets?.find(x => x.id === setId);
  if (s) s[field] = parseFloat(value) || null;
}

async function deleteSet(setId, exId) {
  await sb.from('workout_sets').delete().eq('id', setId);
  if (state.currentWorkout.sets) {
    state.currentWorkout.sets = state.currentWorkout.sets.filter(s => s.id !== setId);
  }
  render();
}

async function finishWorkout() {
  const elapsed = Math.floor((Date.now() - state.workoutTimer) / 1000);
  const totalVol = (state.currentWorkout.sets || []).reduce((s, set) => s + (set.weight_kg || 0) * (set.reps || 0), 0);
  openModal('Terminer la séance', `
    <div class="field"><label>Ressenti</label>
      <div class="chip-row" id="feeling-chips">
        ${['😐 Moyen','🙂 Bien','😊 Très bien','💪 Excellent','🔥 Exceptionnel'].map((f,i) => `
          <div class="chip" onclick="selectFeeling(${i+1})" id="feel-${i+1}">${f}</div>`).join('')}
      </div>
    </div>
    <div class="field"><label>Notes (facultatif)</label><textarea id="workout-notes" placeholder="Remarques…"></textarea></div>
    <div style="background:var(--s2);border-radius:var(--r);padding:14px;margin-bottom:16px;display:flex;gap:16px">
      <div style="text-align:center;flex:1">
        <div style="font-family:var(--fm);font-size:22px;font-weight:700;color:var(--lime)">${fmtDuration(elapsed)}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:3px">DURÉE</div>
      </div>
      <div style="text-align:center;flex:1">
        <div style="font-family:var(--fm);font-size:22px;font-weight:700;color:var(--blue)">${(state.currentWorkout.sets||[]).length}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:3px">SÉRIES</div>
      </div>
      <div style="text-align:center;flex:1">
        <div style="font-family:var(--fm);font-size:22px;font-weight:700;color:var(--orange)">${totalVol.toFixed(0)}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:3px">KG TOTAL</div>
      </div>
    </div>
    <button class="btn btn-primary btn-full" onclick="saveWorkout(${elapsed},${totalVol})">Enregistrer la séance</button>`);
}

let selectedFeeling = 3;
function selectFeeling(val) {
  selectedFeeling = val;
  document.querySelectorAll('#feeling-chips .chip').forEach(c => c.classList.remove('on'));
  document.getElementById('feel-' + val)?.classList.add('on');
}

async function saveWorkout(elapsed, totalVol) {
  const notes = document.getElementById('workout-notes')?.value || '';
  await sb.from('workouts').update({
    ended_at: new Date().toISOString(),
    duration_seconds: elapsed,
    total_volume_kg: totalVol,
    feeling: selectedFeeling,
    notes
  }).eq('id', state.currentWorkout.id);
  closeModal();
  state.currentWorkout = null;
  toast('Séance enregistrée ! 🔥');
  await loadWorkouts();
  go('dashboard');
}

    <button class="btn btn-primary btn-full" onclick="saveProgram()">Créer le programme</button>`);

async function saveProgram() {
  const name = document.getElementById('prog-name').value.trim();
  if (!name) { toast('Entrez un nom', 'error'); return; }
  const { data, error } = await sb.from('programs').insert([{
    user_id: state.user.id,
    name,
    description: document.getElementById('prog-desc').value,
    objective: document.getElementById('prog-obj').value,
    level: document.getElementById('prog-level').value,
    location: document.getElementById('prog-loc').value,
    days_per_week: parseInt(document.getElementById('prog-days').value),
  }]).select().single();
  if (error) { toast(error.message, 'error'); return; }
  closeModal();
  toast('Programme créé !');
  await loadPrograms();
  render();
}

async function deleteProgram(id) {
  if (!confirm('Supprimer ce programme ?')) return;
  await sb.from('programs').delete().eq('id', id);
  toast('Programme supprimé', 'error');
  await loadPrograms();
  render();
}

async function copyTemplate(id) {
  const tpl = state.programs.find(p => p.id === id);
  if (!tpl) return;
  const { data, error } = await sb.from('programs').insert([{
    user_id: state.user.id,
    name: tpl.name + ' (copie)',
    description: tpl.description,
    objective: tpl.objective,
    level: tpl.level,
    location: tpl.location,
    days_per_week: tpl.days_per_week,
    is_template: false
  }]).select().single();
  if (error) { toast(error.message, 'error'); return; }
  toast('Programme copié dans vos programmes !');
  await loadPrograms();
  render();
}

let exFilter = { q: '', cat: '', diff: '', loc: '' };

function renderExercises() {
  const cats = [...new Set(state.exercises.map(e => e.exercise_categories?.name).filter(Boolean))];

  <div class="filter-row">
    <div class="filter-chip${!exFilter.diff?' on':''}" onclick="exFilter.diff='';renderExercisesInPlace()">Tous niveaux</div>

function renderExCard(ex) {
  const diffColor = { debutant: 'tag-lime', intermediaire: 'tag-orange', avance: 'tag-red' };
  return `
  <div class="ex-card" onclick="showExerciseDetail('${ex.id}')">

function renderExercisesInPlace() {
  if (state.tab !== 'exercises') return;
  const cats = [...new Set(state.exercises.map(e => e.exercise_categories?.name).filter(Boolean))];
  const filtered = state.exercises.filter(ex => {
    if (exFilter.q && !ex.name.toLowerCase().includes(exFilter.q.toLowerCase()) &&
        !(ex.muscles_primary || []).some(m => m.toLowerCase().includes(exFilter.q.toLowerCase()))) return false;
    if (exFilter.cat && ex.exercise_categories?.name !== exFilter.cat) return false;
    if (exFilter.diff && ex.difficulty !== exFilter.diff) return false;
    if (exFilter.loc && ex.location !== exFilter.loc && ex.location !== 'les_deux') return false;

async function updateProfile(field, value) {
  const update = { [field]: field.includes('_kg') || field.includes('_cm') ? parseFloat(value) : value, updated_at: new Date().toISOString() };
  const { error } = await sb.from('profiles').update(update).eq('id', state.user.id);
  if (error) { toast(error.message, 'error'); return; }
  if (!state.profile) state.profile = { id: state.user.id };
  state.profile = { ...state.profile, ...update };
  toast('Profil mis à jour ✓');
}

function initCharts() {
  Chart.defaults.color = '#7a8ba8';
  Chart.defaults.borderColor = '#252f42';
  Chart.defaults.font.family = "'Space Grotesk', sans-serif";

  // Volume chart on dashboard
  const cvEl = document.getElementById('chart-volume');
  if (cvEl) {
    const last30 = getLast30DaysData();
    new Chart(cvEl, {
      type: 'bar',
      data: {
        labels: last30.labels,
        datasets: [{
          label: 'Volume (kg)',
          data: last30.data,
          backgroundColor: 'rgba(200,241,53,.3)',
          borderColor: '#c8f135',
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxRotation: 0, maxTicksLimit: 6 } } } }
    });
  }

  // Macros pie
  const cmEl = document.getElementById('chart-macros');
  if (cmEl) {
    const tdee = calcTDEE(state.profile);
    const macros = calcMacros(tdee, state.profile?.objective);
    if (macros) {
      new Chart(cmEl, {
        type: 'doughnut',
        data: {
          labels: ['Protéines', 'Glucides', 'Lipides'],
          datasets: [{ data: [macros.protein * 4, macros.carbs * 4, macros.fat * 9], backgroundColor: ['#60a5fa', '#c8f135', '#f97316'], borderWidth: 0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'right', labels: { boxWidth: 12, padding: 16 } } } }
      });
    }
  }

  // Weekly volume
  const cwEl = document.getElementById('chart-weekly');
  if (cwEl) {
    const weekly = getWeeklyVolumeData();
    new Chart(cwEl, {
      type: 'line',
      data: {
        labels: weekly.labels,
        datasets: [{ label: 'Volume (kg)', data: weekly.data, borderColor: '#c8f135', backgroundColor: 'rgba(200,241,53,.1)', fill: true, tension: 0.4 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  }

  // Frequency
  const cfEl = document.getElementById('chart-freq');
  if (cfEl) {
    const freq = getWeeklyFreqData();
    new Chart(cfEl, {
      type: 'bar',
      data: {
        labels: freq.labels,
        datasets: [{ data: freq.data, backgroundColor: 'rgba(59,130,246,.3)', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 4 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
  }
}

function getLast30DaysData() {
  const days = 30;
  const labels = [];
  const data = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    labels.push(i % 5 === 0 ? d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '');
    const vol = state.workouts.filter(w => w.started_at?.slice(0, 10) === key).reduce((s, w) => s + (w.total_volume_kg || 0), 0);
    data.push(vol);
  }
  return { labels, data };
}

function getWeeklyVolumeData() {
  const weeks = 8;
  const labels = [];
  const data = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const start = new Date();
    start.setDate(start.getDate() - i * 7 - 7);
    const end = new Date();
    end.setDate(end.getDate() - i * 7);
    labels.push(`S${weeks - i}`);
    const vol = state.workouts.filter(w => {
      const d = new Date(w.started_at);
      return d >= start && d < end;
    }).reduce((s, w) => s + (w.total_volume_kg || 0), 0);
    data.push(Math.round(vol));
  }
  return { labels, data };
}

function getWeeklyFreqData() {
  const weeks = 8;
  const labels = [];
  const data = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const start = new Date();
    start.setDate(start.getDate() - i * 7 - 7);
    const end = new Date();
    end.setDate(end.getDate() - i * 7);
    labels.push(`S${weeks - i}`);
    const count = state.workouts.filter(w => {
      const d = new Date(w.started_at);
      return d >= start && d < end;
    }).length;
    data.push(count);
  }
  return { labels, data };
}

init();
</script>
