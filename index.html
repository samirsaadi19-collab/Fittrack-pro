<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0f">
<title>FitTrack Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --accent:#6c63ff;--accent2:#a78bfa;--green:#10b981;--red:#f43f5e;--orange:#f97316;--yellow:#fbbf24;--blue:#3b82f6;
  --bg:#0d0d0f;--bg2:#131316;--bg3:#1a1a1f;
  --glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.14);
  --t1:#f8f8ff;--t2:#a0a0b8;--t3:#5a5a70;
  --r:12px;--r2:18px;--r3:24px;
  --shadow:0 4px 24px rgba(0,0,0,.4);--shadow2:0 8px 40px rgba(0,0,0,.6);
  --fd:'Inter',sans-serif;--fm:'JetBrains Mono',monospace;
}
[data-theme="light"] {
  --bg:#f0f0f8;--bg2:#ffffff;--bg3:#f8f8ff;
  --glass:rgba(0,0,0,.03);--glass2:rgba(0,0,0,.06);
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);
  --t1:#0d0d1a;--t2:#6060a0;--t3:#b0b0d0;
  --shadow:0 4px 24px rgba(0,0,0,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:var(--fd);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
button{cursor:pointer;font-family:var(--fd);border:none;outline:none;}
input,select,textarea{font-family:var(--fd);outline:none;}

/* LAYOUT */
#root{display:flex;min-height:100vh;}
#sidebar{width:80px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px;}
#content{margin-left:80px;flex:1;min-height:100vh;}
#page{padding:24px;max-width:800px;margin:0 auto;padding-bottom:100px;}
@media(max-width:768px){#sidebar{display:none;}#content{margin-left:0;}#page{padding:16px 16px 90px;}#bottom-nav{display:flex!important;}}
@media(max-width:480px){
  .adj-btn{width:32px;height:32px;font-size:16px;}
  .set-num-input{font-size:18px;padding:4px;min-width:0;}
  .workout-timer{font-size:32px;}
  .card{padding:14px;}
  .ex-card .ex-body{padding:10px;}
  .h1{font-size:24px;}
  .rest-countdown{font-size:44px;}
  .g4{gap:6px;}
  .g4>div{padding:8px 4px!important;}
}

/* BOTTOM NAV */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg2);border-top:1px solid var(--border);padding:8px 0 max(8px,env(safe-area-inset-bottom));backdrop-filter:blur(20px);}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;background:none;border:none;color:var(--t3);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;transition:color .15s;}
.bnav-item.active{color:var(--accent);}
.bnav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* SIDEBAR */
.snav-item{width:52px;height:52px;border-radius:var(--r);background:none;border:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .2s;font-size:9px;font-weight:600;}
.snav-item:hover{background:var(--glass);color:var(--t2);}
.snav-item.active{background:rgba(108,99,255,.15);color:var(--accent);}
.snav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.snav-logo{font-family:var(--fm);font-size:18px;font-weight:700;color:var(--accent);margin-bottom:8px;padding:8px;}
.snav-div{width:32px;height:1px;background:var(--border);margin:8px 0;}

/* CARDS */
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r2);padding:20px;backdrop-filter:blur(10px);transition:border-color .2s;}
.card:hover{border-color:var(--border2);}
.card-premium{background:linear-gradient(135deg,rgba(108,99,255,.1),rgba(167,139,250,.05));border-color:rgba(108,99,255,.3);}
.card-success{background:rgba(16,185,129,.06);border-color:rgba(16,185,129,.2);}
.card-danger{background:rgba(244,63,94,.06);border-color:rgba(244,63,94,.2);}
.card-warning{background:rgba(249,115,22,.06);border-color:rgba(249,115,22,.2);}

/* TYPOGRAPHY */
.h1{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em;}
.h2{font-size:22px;font-weight:700;}
.h3{font-size:17px;font-weight:700;}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);}
.gradient-text{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.mono{font-family:var(--fm);}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.flex{display:flex;min-width:0;}.flex-col{flex-direction:column;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}.flex-wrap{flex-wrap:wrap;}
.flex>*{min-width:0;}
.gap-2{gap:8px;}.gap-3{gap:12px;}.gap-4{gap:16px;}
.mb-2{margin-bottom:8px;}.mb-3{margin-bottom:12px;}.mb-4{margin-bottom:16px;}.mb-6{margin-bottom:24px;}.mt-4{margin-top:16px;}

/* STAT CARD */
.stat-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r2);padding:16px;}
.stat-val{font-family:var(--fm);font-size:32px;font-weight:700;line-height:1;}
.stat-label{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--r);font-size:14px;font-weight:600;transition:all .2s;white-space:nowrap;}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 4px 15px rgba(108,99,255,.4);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(108,99,255,.5);transform:translateY(-1px);}
.btn-secondary{background:var(--glass2);border:1px solid var(--border);color:var(--t1);}
.btn-secondary:hover{border-color:var(--border2);}
.btn-danger{background:rgba(244,63,94,.15);border:1px solid rgba(244,63,94,.3);color:var(--red);}
.btn-success{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--green);}
.btn-full{width:100%;}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px;}
.btn-lg{padding:16px 28px;font-size:16px;border-radius:14px;}
.btn-icon{width:38px;height:38px;padding:0;border-radius:10px;background:var(--glass);border:1px solid var(--border);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;}
.btn-icon:hover{color:var(--t1);border-color:var(--border2);}
.btn-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* FORM */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;}
.input{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);color:var(--t1);padding:11px 14px;font-size:14px;transition:border-color .2s,box-shadow .2s;}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.1);}
.input::placeholder{color:var(--t3);}
select.input option{background:var(--bg2);}

/* CHIPS */
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--glass);color:var(--t2);cursor:pointer;transition:all .15s;user-select:none;}
.chip:hover{border-color:var(--border2);color:var(--t1);}
.chip.on{background:rgba(108,99,255,.15);border-color:rgba(108,99,255,.4);color:var(--accent);}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.tag-purple{background:rgba(108,99,255,.12);border:1px solid rgba(108,99,255,.25);color:var(--accent);}
.tag-green{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:var(--green);}
.tag-red{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.25);color:var(--red);}
.tag-orange{background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.25);color:var(--orange);}
.tag-blue{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);color:var(--blue);}

/* PROGRESS */
.progress{height:6px;background:var(--glass2);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease;}

/* MODAL */
#modal{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;}
#modal.show{display:flex;}
#modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);}
#modal-box{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r3) var(--r3) 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;animation:slideUp .3s ease;}
@media(min-width:560px){#modal-box{border-radius:var(--r3);animation:fadeScale .25s ease;}#modal{align-items:center;padding:20px;}}
.modal-header{padding:20px 20px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg2);z-index:1;border-bottom:1px solid var(--border);}
.modal-title{font-size:18px;font-weight:700;}
.modal-body{padding:20px;}

/* ANIMATIONS */
@keyframes slideUp{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
.animate-in{animation:fadeIn .3s ease forwards;}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}

/* TOAST */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg2);border:1px solid var(--border2);color:var(--t1);padding:12px 20px;border-radius:var(--r2);font-size:13px;font-weight:500;z-index:600;box-shadow:var(--shadow2);transition:transform .3s ease;white-space:nowrap;display:flex;align-items:center;gap:8px;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.success{border-color:rgba(16,185,129,.4);}
#toast.error{border-color:rgba(244,63,94,.4);}

/* AUTH */
#auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);position:relative;overflow:hidden;}
#auth-page::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(108,99,255,.15) 0%,transparent 70%);top:-200px;right:-200px;pointer-events:none;}
.auth-container{width:100%;max-width:400px;position:relative;z-index:1;}
.auth-logo{text-align:center;margin-bottom:32px;}
.auth-logo-text{font-family:var(--fm);font-size:32px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.auth-logo-sub{font-size:13px;color:var(--t3);margin-top:4px;}
.auth-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r3);padding:32px;backdrop-filter:blur(20px);}

/* ONBOARDING */
#onboarding{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.ob-step{width:100%;max-width:480px;animation:fadeIn .4s ease;}
.ob-progress{display:flex;gap:6px;margin-bottom:32px;justify-content:center;}
.ob-dot{width:8px;height:8px;border-radius:4px;background:var(--border2);transition:all .3s;}
.ob-dot.active{width:24px;background:var(--accent);}
.ob-dot.done{background:var(--green);}

/* WORKOUT */
.ex-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all .2s;}
.ex-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow);}
.ex-body{padding:14px;}
.ex-name{font-weight:700;font-size:15px;margin-bottom:4px;}
.ex-muscles{font-size:12px;color:var(--t2);margin-bottom:8px;}
.adj-btn{width:36px;height:36px;border-radius:8px;background:var(--glass2);border:1px solid var(--border);color:var(--t1);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;font-weight:300;}
.set-num-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--t1);padding:6px;font-size:20px;font-weight:700;text-align:center;font-family:var(--fm);transition:border-color .15s;}
.set-num-input:focus{border-color:var(--accent);}
.set-done-btn{width:100%;padding:14px;border-radius:var(--r);font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 2px 12px rgba(108,99,255,.3);}
.set-done-btn.done{background:linear-gradient(135deg,var(--green),#34d399);box-shadow:0 2px 12px rgba(16,185,129,.3);}
.rest-card{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(99,102,241,.1));border:1px solid rgba(59,130,246,.3);border-radius:var(--r2);padding:20px;text-align:center;margin:12px 0;animation:fadeIn .3s ease;}
.rest-countdown{font-family:var(--fm);font-size:56px;font-weight:700;color:var(--blue);line-height:1;}
.rest-bar{height:4px;background:rgba(59,130,246,.2);border-radius:2px;overflow:hidden;margin:12px 0;}
.rest-bar-fill{height:100%;background:var(--blue);border-radius:2px;transition:width 1s linear;}
.workout-timer{font-family:var(--fm);font-size:42px;font-weight:700;color:var(--accent);letter-spacing:.05em;}

/* IMC GAUGE */
.bmi-gauge{width:100%;height:12px;border-radius:6px;background:linear-gradient(to right,#3b82f6 0%,#10b981 25%,#fbbf24 50%,#f97316 75%,#f43f5e 100%);position:relative;margin:12px 0;}
.bmi-needle{position:absolute;top:-4px;width:4px;height:20px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 6px rgba(0,0,0,.5);transition:left .5s ease;}
.muscle-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;background:rgba(108,99,255,.1);border:1px solid rgba(108,99,255,.2);color:var(--accent2);margin:3px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.toggle{position:relative;width:46px;height:26px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;position:absolute;}
.toggle-slider{position:absolute;inset:0;background:var(--glass2);border:1px solid var(--border);border-radius:13px;cursor:pointer;transition:.2s;}
.toggle-slider::before{content:'';position:absolute;height:20px;width:20px;left:2px;top:2px;background:var(--t3);border-radius:50%;transition:.2s;}
.toggle input:checked+.toggle-slider{background:var(--accent);border-color:var(--accent);}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);background:#fff;}
.search-wrap{position:relative;margin-bottom:14px;}
.search-wrap .input{padding-left:40px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none;}
.search-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.empty{text-align:center;padding:48px 20px;color:var(--t3);}
.empty svg{width:48px;height:48px;stroke:var(--t3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 14px;display:block;opacity:.4;}
.empty h3{font-size:16px;font-weight:600;color:var(--t2);margin-bottom:6px;}
.streak-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.streak-day{aspect-ratio:1;border-radius:4px;background:var(--glass);}
.streak-day.active{background:var(--accent);}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0;}
.avatar-lg{width:80px;height:80px;font-size:30px;}
.number-badge{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:var(--fm);font-weight:700;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
#loading{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.loading-logo{font-family:var(--fm);font-size:36px;font-weight:700;color:var(--accent);animation:pulse 1.5s infinite;}
.chart-wrap{position:relative;height:180px;}
</style>
</head>
<body>
<div id="loading"><div class="loading-logo">FT</div><div class="spinner"></div></div>

<div id="auth-page" style="display:none">
  <div class="auth-container">
    <div class="auth-logo">
      <div class="auth-logo-text">FitTrack Pro</div>
      <div class="auth-logo-sub">Entraînement · Nutrition · Performance</div>
    </div>
    <div class="auth-card">
      <div id="auth-login-view">
        <div class="h3 mb-2">Connexion</div>
        <div style="color:var(--t2);font-size:13px;margin-bottom:20px">Content de vous revoir 👋</div>
        <div class="field mb-3"><label>Email</label><input type="email" id="li-email" class="input" placeholder="vous@email.com"></div>
        <div class="field mb-4"><label>Mot de passe</label><input type="password" id="li-pwd" class="input" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-full btn-lg" onclick="doLogin()">Se connecter</button>
        <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--t3)">Pas de compte ? <span style="color:var(--accent);cursor:pointer;font-weight:600" onclick="showRegister()">S'inscrire</span></div>
      </div>
      <div id="auth-register-view" style="display:none">
        <div class="h3 mb-2">Créer un compte</div>
        <div style="color:var(--t2);font-size:13px;margin-bottom:20px">Commencez votre transformation 💪</div>
        <div class="g2 mb-3">
          <div class="field"><label>Prénom</label><input type="text" id="re-first" class="input" placeholder="Jean"></div>
          <div class="field"><label>Nom</label><input type="text" id="re-last" class="input" placeholder="Dupont"></div>
        </div>
        <div class="field mb-3"><label>Email</label><input type="email" id="re-email" class="input" placeholder="vous@email.com"></div>
        <div class="field mb-4"><label>Mot de passe</label><input type="password" id="re-pwd" class="input" placeholder="8 caractères min."></div>
        <button class="btn btn-primary btn-full btn-lg" onclick="doRegister()">Créer mon compte</button>
        <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--t3)">Déjà un compte ? <span style="color:var(--accent);cursor:pointer;font-weight:600" onclick="showLogin()">Se connecter</span></div>
      </div>
    </div>
  </div>
</div>

<div id="onboarding" style="display:none">
  <div class="ob-step" id="ob-step"></div>
</div>

<div id="root" style="display:none">
  <nav id="sidebar">

function genUUID(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&0x3|0x8)).toString(16);});}

// HELPERS
// ══════════════════════════════════════════════════
function toast(msg,type='success'){const el=document.getElementById('toast');el.innerHTML=(type==='success'?'✓ ':'✗ ')+msg;el.className='show '+type;setTimeout(()=>el.className='',3000);}
function openModal(t,h){document.getElementById('modal-title').textContent=t;document.getElementById('modal-body').innerHTML=h;document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function fmtDate(iso){return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function fmtDur(s){const m=Math.floor(s/60),sc=s%60;return m>0?`${m}min ${sc}s`:`${sc}s`;}
function fmtTimer(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h>0?`${h}:${p2(m)}:${p2(sc)}`:`${p2(m)}:${p2(sc)}`;}
function p2(n){return String(n).padStart(2,'0');}
function getGreeting(){const h=new Date().getHours();return h<12?'Bonjour':h<18?'Bon apres-midi':'Bonsoir';}

// ══════════════════════════════════════════════════
// CALCULATORS
// ══════════════════════════════════════════════════
function calcBMI(w,h){return w&&h?w/Math.pow(h/100,2):null;}
function getBMIInfo(bmi){if(!bmi)return null;if(bmi<18.5)return{label:'Insuffisance ponderale',color:'var(--blue)',pct:12};if(bmi<25)return{label:'Poids normal',color:'var(--green)',pct:35};if(bmi<30)return{label:'Surpoids',color:'var(--orange)',pct:58};if(bmi<35)return{label:'Obesite moderee',color:'var(--red)',pct:75};return{label:'Obesite severe',color:'#dc2626',pct:92};}
function calcBMR(p){if(!p?.weight_kg||!p?.height_cm||!p?.date_of_birth||!p?.gender)return null;const age=Math.floor((Date.now()-new Date(p.date_of_birth))/(365.25*86400000));return p.gender==='homme'?10*p.weight_kg+6.25*p.height_cm-5*age+5:10*p.weight_kg+6.25*p.height_cm-5*age-161;}
function calcTDEE(p){const bmr=calcBMR(p);if(!bmr)return null;const m={sedentaire:1.2,leger:1.375,modere:1.55,actif:1.725,tres_actif:1.9};return Math.round(bmr*(m[p.activity_level]||1.55));}
function calcMacros(tdee,obj){if(!tdee)return null;const cal={seche:Math.round(tdee*.82),maintien:tdee,prise_de_masse:Math.round(tdee*1.12),recomposition:tdee}[obj]||tdee;const pr=Math.round(cal*.30/4),fa=Math.round(cal*.25/9),cb=Math.round((cal-pr*4-fa*9)/4);return{calories:cal,protein:pr,carbs:cb,fat:fa};}
function calcLeanMass(p){if(!p?.weight_kg||!p?.height_cm||!p?.gender)return null;return p.gender==='homme'?0.407*p.weight_kg+0.267*p.height_cm-19.2:0.252*p.weight_kg+0.473*p.height_cm-48.3;}
function getObjLabel(o){return{seche:'Seche',maintien:'Maintien',prise_de_masse:'Prise de masse',recomposition:'Recomposition',force:'Force',hypertrophie:'Hypertrophie',endurance:'Endurance'}[o]||o||'Non defini';}
function getDiffLabel(d){return{debutant:'Debutant',intermediaire:'Intermediaire',avance:'Avance'}[d]||d;}
function getLocLabel(l){return{salle:'Salle',maison:'Maison',les_deux:'Salle & Maison'}[l]||l;}

function getWorkoutRec(p){
  const obj=p?.objective||'maintien';
  const recs={seche:{sets:3,repsMin:12,repsMax:20,rest:60,intensity:'Leger-Modere',note:'Cardio 20-30min apres'},maintien:{sets:3,repsMin:10,repsMax:15,rest:90,intensity:'Modere',note:'Equilibre force et endurance'},prise_de_masse:{sets:4,repsMin:6,repsMax:12,rest:120,intensity:'Lourd',note:'Manger en surplus calorique'},recomposition:{sets:3,repsMin:8,repsMax:15,rest:90,intensity:'Modere',note:'Deficit modere'},force:{sets:5,repsMin:3,repsMax:6,rest:180,intensity:'Maximum',note:'Progression lineaire obligatoire'},hypertrophie:{sets:4,repsMin:8,repsMax:12,rest:90,intensity:'Lourd-Modere',note:'TUT 40-60 secondes'},endurance:{sets:3,repsMin:15,repsMax:25,rest:45,intensity:'Leger',note:'Peu de repos entre series'}};
  return recs[obj]||recs.maintien;
}

function suggestWeight(exId){
  const ex=EX.find(e=>e.id===exId);
  if(ex && isCalisthenic(ex)) return 0;
  const exName=ex?.name;
  const prev=S.workouts.flatMap(w=>(w.workout_sets||[]).map(s=>({...s,wdate:w.started_at})))
    .filter(s=>s.weight_kg && s.notes && exName && s.notes.split('|')[0]===exName)
    .sort((a,b)=>new Date(b.created_at||b.wdate)-new Date(a.created_at||a.wdate));
  if(prev.length>0)return prev[0].weight_kg;
  const bw=S.profile?.weight_kg||70,obj=S.profile?.objective||'maintien';
  const pcts={prise_de_masse:.45,seche:.28,force:.6,maintien:.35};
  return Math.round((bw*(pcts[obj]||.35))/2.5)*2.5;
}

function autoSelectExercises(){
  const p=S.profile,obj=p?.objective||'maintien',loc=p?.training_location||'salle',level=p?.experience_level||'debutant';
  const groups={seche:['Full Body','Cardio','Abdominaux','Jambes','Dos'],maintien:['Poitrine','Dos','Jambes','Epaules','Abdominaux'],prise_de_masse:['Poitrine','Dos','Jambes','Epaules','Biceps','Triceps'],force:['Poitrine','Dos','Jambes'],hypertrophie:['Poitrine','Dos','Epaules','Jambes','Biceps','Triceps'],recomposition:['Poitrine','Dos','Jambes','Abdominaux'],endurance:['Cardio','Full Body','Abdominaux']};
  const cats=(groups[obj]||groups.maintien).slice(0,4);
  const result=[];
  cats.forEach(cat=>{
    const pool=EX.filter(e=>e.cat===cat&&(e.loc===loc||e.loc==='les_deux')&&(level==='avance'||e.diff!=='avance'));
    if(pool.length>0)result.push(pool[Math.floor(Math.random()*pool.length)]);
  });
  return result;
}

function calcStreak(){if(!S.workouts.length)return 0;let s=0,d=new Date();d.setHours(0,0,0,0);while(true){const iso=d.toISOString().slice(0,10);if(S.workouts.some(w=>w.started_at?.slice(0,10)===iso)){s++;d.setDate(d.getDate()-1);}else break;}return s;}

function renderStreakCal(){
  const days=56,cells=[];
  for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const iso=d.toISOString().slice(0,10);const hasW=S.workouts.some(w=>w.started_at?.slice(0,10)===iso);cells.push(`<div class="streak-day ${hasW?'active':''}" title="${iso}"></div>`);}
  return`<div class="flex gap-2 mb-2">${['L','M','M','J','V','S','D'].map(d=>`<div style="font-size:10px;color:var(--t3);flex:1;text-align:center">${d}</div>`).join('')}</div><div class="streak-grid">${cells.join('')}</div>`;
}

function renderWoCard(w){
  const sets=w.workout_sets?.length||0,dur=w.duration_seconds?fmtDur(w.duration_seconds):'--';
  return`<div class="card mb-3 flex gap-3" style="cursor:pointer" onclick="showWoDetail('${w.id}')"><div style="width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px;flex-shrink:0"></div><div style="flex:1"><div class="flex items-center justify-between mb-1"><div style="font-weight:700">${w.name}</div>${w.feeling?`<span style="font-size:18px">${['😐','🙂','😊','💪','🔥'][w.feeling-1]}</span>`:''}</div><div style="font-size:12px;color:var(--t3);margin-bottom:8px">${fmtDate(w.started_at)} · ${fmtTime(w.started_at)}</div><div class="flex gap-3"><span style="font-size:12px;color:var(--t2)">⏱ ${dur}</span><span style="font-size:12px;color:var(--t2)">📊 ${sets} series</span>${w.total_volume_kg?`<span style="font-size:12px;color:var(--t2)">🏋️ ${w.total_volume_kg.toFixed(0)}kg</span>`:''}</div></div></div>`;
}

function getTodayProgram() {
  const p = S.profile;
  const freq = p?.training_days_per_week || 3;
  const obj = p?.objective || 'maintien';
  const dayOfWeek = new Date().getDay(); // 0=dim, 1=lun...6=sam
  // Jours d'entraînement : on mappe selon fréquence
  const schedules = {
    2: [1, 4],
    3: [1, 3, 5],
    4: [1, 2, 4, 5],
    5: [1, 2, 3, 4, 5],
    6: [1, 2, 3, 4, 5, 6],
  };
  const progKey = freq >= 5 ? 5 : freq >= 4 ? 4 : 3;
  const program = WEEKLY_PROGRAMS[progKey]?.[obj] || WEEKLY_PROGRAMS[3].maintien;
  const todayDays = schedules[freq] || schedules[3];
  const isTrainingDay = todayDays.includes(dayOfWeek);
  // Trouver la séance du jour (par index dans le programme)
  const dayIndex = todayDays.indexOf(dayOfWeek);
  const todaySession = dayIndex >= 0 ? program[dayIndex % program.length] : null;
  return { program, todaySession, isTrainingDay, freq: progKey, obj };
}

function getExercisesForCats(cats, loc, level) {
  const result = [];
  cats.forEach(cat => {
    const pool = EX.filter(e =>
      e.cat === cat &&
      (e.loc === loc || e.loc === 'les_deux') &&
      (level === 'avance' || e.diff !== 'avance')
    );
    const count = cats.length <= 2 ? 3 : 2;
    const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, count);
    result.push(...shuffled);
  });
  return result;
}

async function startProgramWorkout(name, catsStr) {
  const cats = catsStr.split(',');
  const loc = S.profile?.training_location || 'salle';
  const level = S.profile?.experience_level || 'debutant';
  const{data,error}=await sb.from('workouts').insert([{user_id:S.user.id,name,started_at:new Date().toISOString()}]).select().single();
  if(error){toast(error.message,'error');return;}
  S.currentWorkout={...data,sets:[],warmupDone:false};
  S.workoutTimer=Date.now();
  const rec = getWorkoutRec(S.profile);
  const exList = getExercisesForCats(cats, loc, level);
  for(const ex of exList){
    for(let i=1;i<=rec.sets;i++){
      const sw=suggestWeight(ex.id);
      const{data:sd}=await sb.from('workout_sets').insert([{workout_id:S.currentWorkout.id,set_number:i,weight_kg:sw,reps:rec.repsMin,notes:ex.name+'|'+ex.cat}]).select().single();
      if(sd)S.currentWorkout.sets.push({...sd,exercise_id:ex.id,exercise_name:ex.name,exercise_cat:ex.cat});
    }
  }
  nav('workout');
}

async function startWorkout(name=null){
  const n=name||`Seance du ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}`;
  const{data,error}=await sb.from('workouts').insert([{user_id:S.user.id,name:n,started_at:new Date().toISOString()}]).select().single();
  if(error){toast(error.message,'error');return;}
  S.currentWorkout={...data,sets:[],warmupDone:false};
  S.workoutTimer=Date.now();
  const rec=getWorkoutRec(S.profile);
  const exList=autoSelectExercises();
  for(const ex of exList){
    for(let i=1;i<=rec.sets;i++){
      const sw=suggestWeight(ex.id);
      const{data:sd}=await sb.from('workout_sets').insert([{workout_id:S.currentWorkout.id,set_number:i,weight_kg:sw,reps:rec.repsMin,notes:ex.name+'|'+ex.cat}]).select().single();
      if(sd)S.currentWorkout.sets.push({...sd,exercise_id:ex.id,exercise_name:ex.name,exercise_cat:ex.cat});
    }
  }
  nav('workout');
}

async function repeatWorkout(wid){
  const prev=S.workouts.find(w=>w.id===wid);
  if(!prev)return;
  await startWorkout(prev.name);
}

function adjV(id,delta){const el=document.getElementById(id);if(!el)return;el.value=Math.max(0,Math.round(((parseFloat(el.value)||0)+delta)*10)/10);el.dispatchEvent(new Event('change'));}
function updSL(sid,field,val){const s=S.currentWorkout?.sets?.find(x=>x.id===sid);if(s)s[field]=parseFloat(val)||0;}

async function completeSet(sid,exId,restSecs,wId,rId,cali=false){
  const r=parseInt(document.getElementById(rId)?.value)||0;
  const w=cali?0:(parseFloat(document.getElementById(wId)?.value)||0);
  if(!r||(!cali&&!w)){toast(cali?'Entrez le nombre de reps':'Entrez le poids et les reps','error');return;}
  await sb.from('workout_sets').update({weight_kg:w,reps:r,completed:true}).eq('id',sid);
  const s=S.currentWorkout.sets?.find(x=>x.id===sid);if(s){s.weight_kg=w;s.reps=r;s.completed=true;}
  S.restExId=exId;S.restSecs=restSecs;
  toast(cali?`✓ ${r} reps`:`✓ ${r} reps x ${w}kg`);nav('workout');
  setTimeout(()=>startRestInCard(exId,restSecs),100);
}

function startRestInCard(exId,secs){
  clearInterval(restIv);S.restSecs=secs;const total=secs;
  const upd=()=>{const cd=document.getElementById(`rest-cd-${exId}`),bar=document.getElementById(`rest-bar-${exId}`);if(!cd){clearInterval(restIv);return;}cd.textContent=S.restSecs;if(bar)bar.style.width=`${(S.restSecs/total)*100}%`;};
  upd();restIv=setInterval(()=>{S.restSecs--;if(S.restSecs<=0){clearInterval(restIv);S.restExId=null;if(navigator.vibrate)navigator.vibrate([200,100,200]);toast('Repos termine !');nav('workout');return;}upd();},1000);
}

async function addSetToEx(exId,exName,exCat){
  if(!S.currentWorkout){toast('Aucune seance en cours','error');return;}
  const rec=getWorkoutRec(S.profile),sw=suggestWeight(exId);
  const setNum=(S.currentWorkout.sets.filter(s=>s.exercise_id===exId).length+1);
  const{data,error}=await sb.from('workout_sets').insert([{workout_id:S.currentWorkout.id,set_number:setNum,weight_kg:sw,reps:rec.repsMin,notes:exName+'|'+exCat}]).select().single();
  if(error){toast(error.message,'error');return;}
  if(data){S.currentWorkout.sets.push({...data,exercise_id:exId,exercise_name:exName,exercise_cat:exCat});toast('Serie ajoutee !');nav('workout');}
}

function initExDemo(id){
  const c=document.getElementById('demo-'+id);
  if(!c)return;
  const a=c.querySelector('.demo-a'),b=c.querySelector('.demo-b');
  let okA=false,okB=false,failed=false,iv=null;
  const fail=()=>{failed=true;clearInterval(iv);c.style.display='none';};
  const tryStart=()=>{
    if(failed)return;
    if(okA&&okB){
      let toggle=false;
      iv=setInterval(()=>{
        if(!document.getElementById('demo-'+id)){clearInterval(iv);return;}
        toggle=!toggle;a.style.opacity=toggle?'0':'1';b.style.opacity=toggle?'1':'0';
      },900);
    }
  };
  a.onload=()=>{okA=true;tryStart();};
  b.onload=()=>{okB=true;tryStart();};
  a.onerror=fail;b.onerror=fail;
  if(a.complete&&a.naturalWidth>0){okA=true;}
  if(b.complete&&b.naturalWidth>0){okB=true;}
  tryStart();
}

    <div class="flex items-center justify-between mb-4"><div class="label">Besoins journaliers · ${getObjLabel(p?.objective)}</div></div>
    <div style="text-align:center;margin-bottom:20px"><div class="mono" style="font-size:56px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1">${macros?.calories||'--'}</div><div style="font-size:14px;color:var(--t2);margin-top:6px">calories / jour</div></div>
    <div class="g2 mb-3"><div style="text-align:center;background:var(--glass);border-radius:var(--r);padding:12px"><div class="mono" style="font-size:16px;font-weight:700;color:var(--t3)">${bmr?Math.round(bmr):'--'}</div><div class="label mt-1">BMR</div></div><div style="text-align:center;background:var(--glass);border-radius:var(--r);padding:12px"><div class="mono" style="font-size:16px;font-weight:700;color:var(--t3)">${tdee||'--'}</div><div class="label mt-1">TDEE</div></div></div>
    ${macros?`<div class="g3">${[['Proteines',macros.protein,'g','var(--blue)',30],['Glucides',macros.carbs,'g','var(--green)',45],['Lipides',macros.fat,'g','var(--orange)',25]].map(([n,v,u,c,pct])=>`<div style="text-align:center"><div style="background:var(--glass);border:2px solid ${c};border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px"><div class="mono" style="font-size:18px;font-weight:700;color:${c}">${v}</div></div><div style="font-size:11px;font-weight:700;color:var(--t2)">${n}</div><div style="font-size:10px;color:var(--t3)">${pct}%</div></div>`).join('')}</div>
    <div class="card mt-4" style="background:var(--glass)"><div class="chart-wrap" style="height:160px"><canvas id="ch-macros"></canvas></div></div>`:''}
  </div>
  <div class="section-header"><div class="label">Repas types · ${getObjLabel(p?.objective)}</div></div>
  ${meals.map(m=>`<div class="card mb-3"><div class="flex items-center justify-between mb-3"><div class="flex items-center gap-3"><div style="font-size:28px">${m.e}</div><div><div style="font-weight:700">${m.n}</div><div style="font-size:12px;color:var(--t3)">${m.cal} kcal</div></div></div></div><div class="g3 mb-3">${[['P',m.p,'var(--blue)'],['G',m.c,'var(--green)'],['L',m.f,'var(--orange)']].map(([l,v,c])=>`<div style="text-align:center;background:var(--glass);border-radius:10px;padding:8px"><div class="mono" style="font-size:18px;font-weight:700;color:${c}">${v}g</div><div style="font-size:9px;color:var(--t3);font-weight:700">${l}</div></div>`).join('')}</div><div class="label mb-2">Ingredients</div>${m.ings.map(i=>`<div style="font-size:12px;color:var(--t2);padding:3px 0;border-bottom:1px solid var(--border)">• ${i}</div>`).join('')}</div>`).join('')}
  <div class="section-header mt-4"><div class="label">Complements · Cliquer pour details</div></div>
  <div class="g2">${SUPPS.map(s=>`<div class="card" style="padding:0;overflow:hidden;cursor:pointer" onclick="showSuppDetail('${s.name}')"><div style="height:100px;overflow:hidden;position:relative"><img src="${s.img}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"><div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(13,13,15,.9))"></div><div style="position:absolute;bottom:8px;right:8px;font-size:16px">ℹ️</div></div><div style="padding:10px"><div style="font-weight:700;font-size:13px;margin-bottom:3px">${s.name}</div><div style="font-size:11px;color:var(--accent);font-weight:600">${s.dose}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">${s.benefit}</div></div></div>`).join('')}</div>`}`;
}

function showSuppDetail(name){
  const D={'Creatine':{desc:'Le complement le plus efficace. Augmente les reserves de phosphocreatine pour produire plus d energie lors des efforts.',benefits:['Force +10-15%','Volume musculaire','Recuperation rapide'],dose:'3-5g par jour. Constance quotidienne essentielle.',timing:'N importe quand dans la journee.',warning:'Boire 2L eau/jour. Sur sur le long terme.'},'Whey':{desc:'Proteine extraite du lait, digestion rapide. Fournit tous les acides amines essentiels.',benefits:['Synthese musculaire maximale','Pratique','Satiente durable'],dose:'25-30g apres seance. 1-2 shakers par jour.',timing:'Dans les 30 minutes apres la seance.',warning:'Complement alimentaire, pas substitut aux repas.'},'Omega-3':{desc:'Acides gras EPA et DHA anti-inflammatoires. Ameliorent composition corporelle et recuperation.',benefits:['Anti-inflammation','Recuperation musculaire','Sante cardiaque'],dose:'2-3g d EPA+DHA par jour.',timing:'Avec les repas.',warning:'Choisir marque certifiee IFOS.'},'Vitamine D3':{desc:'Hormone essentielle. 80% de la population est deficiente. Role dans testosterone et immunite.',benefits:['Testosterone naturelle','Force musculaire','Immunite'],dose:'2000-4000 UI par jour avec repas gras.',timing:'Matin avec le petit-dejeuner.',warning:'Associer avec vitamine K2.'},'Magnesium':{desc:'Intervient dans 300+ reactions enzymatiques. Sportifs en perdent par transpiration.',benefits:['Qualite du sommeil','Reduction crampes','Recuperation nerveuse'],dose:'300-400mg bisglycinate le soir.',timing:'1h avant le coucher.',warning:'Eviter oxyde de magnesium, mal absorbe.'},'Cafeine':{desc:'Stimulant le plus efficace. Augmente energie, force et brule-graisses.',benefits:['Energie +30%','Force et endurance','Brule-graisses'],dose:'100-200mg avant la seance.',timing:'30-45min avant entrainement.',warning:'Eviter apres 14h. Cycles reguliers.'}};
  const d=D[name]||{};
  openModal(name,`<div style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:16px">${d.desc||''}</div><div class="label mb-2">Benefices</div>${(d.benefits||[]).map(b=>`<div class="card card-success mb-2" style="padding:10px 14px;font-size:13px">💪 ${b}</div>`).join('')}<div class="divider"></div><div class="label mb-2">Posologie</div><div class="card mb-3" style="font-size:13px;color:var(--t2);line-height:1.6">${d.dose||''}</div><div class="label mb-2">Timing optimal</div><div class="card card-premium mb-3" style="font-size:13px;color:var(--t2)">⏰ ${d.timing||''}</div><div class="label mb-2">A savoir</div><div class="card card-warning" style="font-size:13px;color:var(--t2)">⚠️ ${d.warning||''}</div>`);
}

// ══════════════════════════════════════════════════
// PROGRESS
// ══════════════════════════════════════════════════
function renderProgress(){
  const totalW=S.workouts.length,totalSets=S.workouts.reduce((s,w)=>s+(w.workout_sets?.length||0),0);
  const totalVol=S.workouts.reduce((s,w)=>s+(w.total_volume_kg||0),0);
  const avgDur=S.workouts.length?Math.round(S.workouts.reduce((s,w)=>s+(w.duration_seconds||0),0)/S.workouts.length):0;
  const prs=computePRs();
  return`
  <div class="h1 mb-2">Progression</div>
  <div style="color:var(--t2);font-size:14px;margin-bottom:24px">Statistiques et performances</div>
  <div class="g2 mb-4">
    <div class="stat-card"><div class="stat-val" style="color:var(--accent)">${totalW}</div><div class="stat-label">Seances</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--green)">${totalSets}</div><div class="stat-label">Series</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--orange);font-size:24px">${Math.round(totalVol/1000*10)/10}T</div><div class="stat-label">Volume total</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--blue);font-size:22px">${fmtDur(avgDur)}</div><div class="stat-label">Duree moy.</div></div>
  </div>
  <div class="section-header"><div class="label">Volume hebdomadaire</div></div>
  <div class="card mb-4"><div class="chart-wrap"><canvas id="ch-weekly"></canvas></div></div>
  <div class="section-header"><div class="label">Frequence</div></div>
  <div class="card mb-4"><div class="chart-wrap"><canvas id="ch-freq"></canvas></div></div>
  ${prs.length>0?`<div class="section-header"><div class="label">Records personnels 🏆</div></div>${prs.map(pr=>`<div class="card mb-3 flex items-center gap-3"><div class="number-badge">PR</div><div style="flex:1"><div style="font-weight:700">${pr.name}</div><div style="font-size:12px;color:var(--t3)">${fmtDate(pr.date)}</div></div><div class="mono" style="font-size:18px;font-weight:700;color:var(--accent)">${pr.weight}kg x ${pr.reps}</div></div>`).join('')}`:''}`;
}

function computePRs(){
  const prs={};
  S.workouts.forEach(w=>{(w.workout_sets||[]).forEach(s=>{if(!s.weight_kg||!s.reps||!s.notes)return;const exName=s.notes.split('|')[0];if(!exName)return;const vol=s.weight_kg*s.reps;if(!prs[exName]||vol>prs[exName].vol)prs[exName]={name:exName,weight:s.weight_kg,reps:s.reps,vol,date:w.started_at};});});
  return Object.values(prs).sort((a,b)=>b.vol-a.vol).slice(0,8);
}

// ══════════════════════════════════════════════════
// PROFILE
// ══════════════════════════════════════════════════
function renderProfile(){
  const p=S.profile,bmi=calcBMI(p?.weight_kg,p?.height_cm),lean=calcLeanMass(p);
  const init=p?.full_name?.[0]?.toUpperCase()||'?';
  return`
  <div class="card card-premium mb-4">
    <div class="flex items-center gap-4 mb-4"><div class="avatar avatar-lg">${init}</div><div><div class="h2">${p?.full_name||'Athlete'}</div><div style="font-size:13px;color:var(--t2)">${S.user?.email}</div><div class="flex gap-2 mt-2">${p?.objective?`<span class="tag tag-purple">${getObjLabel(p.objective)}</span>`:''} ${p?.experience_level?`<span class="tag tag-green">${getDiffLabel(p.experience_level)}</span>`:''}</div></div></div>
    ${bmi?`<div class="g3"><div style="text-align:center"><div class="mono" style="font-size:22px;font-weight:700;color:${getBMIInfo(bmi).color}">${bmi.toFixed(1)}</div><div class="label mt-1">IMC</div></div>${lean?`<div style="text-align:center"><div class="mono" style="font-size:22px;font-weight:700;color:var(--blue)">${lean.toFixed(1)}</div><div class="label mt-1">Masse maigre</div></div>`:'<div></div>'}<div style="text-align:center"><div class="mono" style="font-size:22px;font-weight:700;color:var(--green)">${S.workouts.length}</div><div class="label mt-1">Seances</div></div></div>`:''}
  </div>
  <div class="section-header"><div class="label">Informations physiques</div></div>
  <div class="card mb-4">
    <div class="g2 mb-3"><div class="field"><label>Taille (cm)</label><input type="number" class="input" value="${p?.height_cm||''}" placeholder="175" onchange="updP('height_cm',this.value)"></div><div class="field"><label>Poids (kg)</label><input type="number" class="input" step=".1" value="${p?.weight_kg||''}" placeholder="75" onchange="updP('weight_kg',this.value)"></div></div>
    <div class="g2 mb-3"><div class="field"><label>Tour de taille (cm)</label><input type="number" class="input" value="${p?.waist_cm||''}" placeholder="80" onchange="updP('waist_cm',this.value)"></div><div class="field"><label>Date de naissance</label><input type="date" class="input" value="${p?.date_of_birth||''}" onchange="updP('date_of_birth',this.value)"></div></div>
    <div class="field"><label>Genre</label><select class="input" onchange="updP('gender',this.value)"><option value="">--</option>${[['homme','Homme'],['femme','Femme'],['autre','Autre']].map(([v,l])=>`<option value="${v}" ${p?.gender===v?'selected':''}>${l}</option>`).join('')}</select></div>
  </div>
  <div class="section-header"><div class="label">Objectifs et entrainement</div></div>
  <div class="card mb-4">
    <div class="field mb-3"><label>Objectif</label><select class="input" onchange="updP('objective',this.value)">${[['seche','Seche'],['maintien','Maintien'],['prise_de_masse','Prise de masse'],['recomposition','Recomposition'],['force','Force'],['hypertrophie','Hypertrophie'],['endurance','Endurance']].map(([v,l])=>`<option value="${v}" ${p?.objective===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="g2 mb-3"><div class="field"><label>Niveau</label><select class="input" onchange="updP('experience_level',this.value)">${[['debutant','Debutant'],['intermediaire','Intermediaire'],['avance','Avance']].map(([v,l])=>`<option value="${v}" ${p?.experience_level===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Lieu</label><select class="input" onchange="updP('training_location',this.value)">${[['salle','Salle'],['maison','Maison'],['les_deux','Les deux']].map(([v,l])=>`<option value="${v}" ${p?.training_location===v?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <div class="field"><label>Niveau activite</label><select class="input" onchange="updP('activity_level',this.value)">${[['sedentaire','Sedentaire'],['leger','Legerement actif'],['modere','Moderement actif'],['actif','Tres actif'],['tres_actif','Athlete']].map(([v,l])=>`<option value="${v}" ${p?.activity_level===v?'selected':''}>${l}</option>`).join('')}</select></div>
  </div>
  <div class="section-header"><div class="label">Preferences</div></div>
  <div class="card mb-4">
    <div class="flex items-center justify-between" style="padding:8px 0">
      <div><div style="font-weight:500">Mode sombre</div><div style="font-size:12px;color:var(--t3)">Interface sombre</div></div>
      <label class="toggle"><input type="checkbox" ${document.documentElement.dataset.theme==='dark'?'checked':''} onchange="toggleTheme()"><span class="toggle-slider"></span></label>
    </div>
  </div>
  <button class="btn btn-danger btn-full" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Se deconnecter</button>`;
}

async function updP(field,val){
  const v=(field==='height_cm'||field==='weight_kg'||field==='waist_cm')?parseFloat(val)||null:val;
  const{error}=await sb.from('profiles').update({[field]:v,updated_at:new Date().toISOString()}).eq('id',S.user.id);
  if(!error){if(!S.profile)S.profile={id:S.user.id};S.profile[field]=v;toast('Profil mis a jour');}
  else toast(error.message,'error');
}

function toggleTheme(){const t=document.documentElement.dataset.theme;document.documentElement.dataset.theme=t==='dark'?'light':'dark';localStorage.setItem('theme',document.documentElement.dataset.theme);}

// ══════════════════════════════════════════════════
// CHARTS
// ══════════════════════════════════════════════════
function initCharts(){
  Chart.defaults.color='rgba(160,160,184,.8)';
  Chart.defaults.borderColor='rgba(255,255,255,.06)';
  Chart.defaults.font.family="'Inter',sans-serif";

  const cvEl=document.getElementById('ch-vol');
  if(cvEl){const d=getLast30();new Chart(cvEl,{type:'bar',data:{labels:d.labels,datasets:[{data:d.vals,backgroundColor:'rgba(108,99,255,.35)',borderColor:'var(--accent)',borderWidth:1,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:6,maxRotation:0}},y:{beginAtZero:true}}}});}

  const cmEl=document.getElementById('ch-macros');
  if(cmEl){const m=calcMacros(calcTDEE(S.profile),S.profile?.objective);if(m)new Chart(cmEl,{type:'doughnut',data:{labels:['Proteines','Glucides','Lipides'],datasets:[{data:[m.protein*4,m.carbs*4,m.fat*9],backgroundColor:['rgba(59,130,246,.8)','rgba(16,185,129,.8)','rgba(249,115,22,.8)'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{position:'right',labels:{boxWidth:12,padding:12}}}}});}

  const cwEl=document.getElementById('ch-weekly');
  if(cwEl){const d=getWeekly();new Chart(cwEl,{type:'line',data:{labels:d.labels,datasets:[{label:'Volume (kg)',data:d.vals,borderColor:'var(--accent)',backgroundColor:'rgba(108,99,255,.1)',fill:true,tension:.4,pointBackgroundColor:'var(--accent)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});}

  const cfEl=document.getElementById('ch-freq');
  if(cfEl){const d=getFreq();new Chart(cfEl,{type:'bar',data:{labels:d.labels,datasets:[{data:d.vals,backgroundColor:'rgba(16,185,129,.35)',borderColor:'var(--green)',borderWidth:1,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}}}}});}
}

function getLast30(){const labels=[],vals=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);labels.push(i%7===0?d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'');vals.push(S.workouts.filter(w=>w.started_at?.slice(0,10)===k).reduce((s,w)=>s+(w.total_volume_kg||0),0));}return{labels,vals};}
function getWeekly(){const labels=[],vals=[];for(let i=7;i>=0;i--){const s2=new Date();s2.setDate(s2.getDate()-i*7-7);const e=new Date();e.setDate(e.getDate()-i*7);labels.push(`S${8-i}`);vals.push(Math.round(S.workouts.filter(w=>{const d=new Date(w.started_at);return d>=s2&&d<e;}).reduce((s,w)=>s+(w.total_volume_kg||0),0)));}return{labels,vals};}
function getFreq(){const labels=[],vals=[];for(let i=7;i>=0;i--){const s2=new Date();s2.setDate(s2.getDate()-i*7-7);const e=new Date();e.setDate(e.getDate()-i*7);labels.push(`S${8-i}`);vals.push(S.workouts.filter(w=>{const d=new Date(w.started_at);return d>=s2&&d<e;}).length);}return{labels,vals};}

// ══════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════
const savedTheme=localStorage.getItem('theme');
if(savedTheme)document.documentElement.dataset.theme=savedTheme;
init();
</script>
</body>
</html>
